name: Build & Release EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install FFmpeg
      run: |
        choco install ffmpeg -y
        ffmpeg -version

    - name: Get version
      id: version
      shell: powershell
      run: |
        if ($env:GITHUB_REF -like "refs/tags/*") {
          $version = $env:GITHUB_REF.Replace("refs/tags/", "")
        } else {
          $version = "dev-" + $env:GITHUB_RUN_NUMBER
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Build EXE
      run: |
        pyinstaller --onefile `
                    --noconsole `
                    --icon=icon/icon.ico `
                    --name=YoutubeMP3-${{ steps.version.outputs.VERSION }} `
                    pyfixmp3.py

    - name: Rename EXE
      run: |
        move dist/YoutubeMP3-${{ steps.version.outputs.VERSION }}.exe YoutubeMP3.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: YoutubeMP3
        path: YoutubeMP3.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.version.outputs.VERSION }}
        files: YoutubeMP3.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
``
