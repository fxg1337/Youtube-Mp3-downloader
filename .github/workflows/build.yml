name: Build & Release EXE

on:
  push:
    tags:
      - "v*.*.*"   # triggers on version tags like v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Get version
      id: version
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pytubefix pydub ffmpeg-python

   
    - name: Setup FFmpeg
      run: |
        choco install ffmpeg -y
        ffmpeg -version

    - name: Build EXE
      run: |
        pyinstaller --onefile ^
                    --noconsole ^
                    --icon=icon/icon.ico ^
                    --name=YoutubeMP3-${{ steps.version.outputs.VERSION }} ^
                    pyfixmp3.py

    - name: Rename output
      run: |
        move dist/YoutubeMP3-${{ steps.version.outputs.VERSION }}.exe YoutubeMP3.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: YoutubeMP3
        path: YoutubeMP3.exe

    - name: Create Release (only on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: YoutubeMP3.exe
        name: Release ${{ steps.version.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
